<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Triqui - Jugador1 vs Máquina</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: #eeeeee;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .juego {
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);

            text-align: center;

            width: 380px;
        }

        h1 {
            margin-top: 0;
            font-size: 40px;
        }

        #estado {
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 20px;
        }

        .marcador {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        .marcador div {

            flex: 1;

            background: #f5f5f5;

            border-radius: 10px;

            padding: 10px 5px;

            font-size: 13px;

            font-weight: bold;

            color: #666;
        }

        .marcador b {

            display: block;

            font-size: 24px;

            margin-top: 4px;
        }

        .marcador .jugador b {
            color: #e74c3c;
        }

        .marcador .maquina b {
            color: #3498db;
        }

        .marcador .empate b {
            color: #555;
        }

        .tablero {

            width: 330px;
            height: 330px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            gap: 8px;
        }

        .casilla {

            background: #e5e5e5;

            border: none;

            border-radius: 10px;

            font-size: 65px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.15s;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .casilla:hover {

            background: #d5d5d5;

            transform: scale(1.03);
        }

        .casilla:disabled {

            cursor: default;
        }

        .equis {

            color: #e74c3c;
        }

        .circulo {

            width: 55%;
            height: 55%;

            border-radius: 50%;

            background: #3498db;
        }

        .ganadora {

            background: #8ee68e !important;
        }

        .acciones {

            display: flex;

            gap: 10px;

            justify-content: center;

            margin-top: 25px;

            flex-wrap: wrap;
        }

        #reiniciar, #borrarHistorial {

            padding: 12px 20px;

            font-size: 15px;

            border: none;

            border-radius: 8px;

            color: white;

            cursor: pointer;
        }

        #reiniciar {

            background: #333;
        }

        #reiniciar:hover {

            background: #555;
        }

        #borrarHistorial {

            background: #b33333;
        }

        #borrarHistorial:hover {

            background: #d55555;
        }

        .historial {

            margin-top: 20px;

            text-align: left;

            max-height: 150px;

            overflow-y: auto;

            font-size: 13px;

            background: #fafafa;

            border-radius: 10px;

            padding: 10px 12px;
        }

        .historial h3 {

            margin: 0 0 8px;

            font-size: 14px;
        }

        .historial ul {

            list-style: none;

            margin: 0;

            padding: 0;
        }

        .historial li {

            padding: 4px 0;

            border-bottom: 1px solid #eee;

            color: #444;
        }

        .historial li:last-child {

            border-bottom: none;
        }

    </style>
</head>

<body>

<div class="juego">

    <h1>Triqui</h1>

    <div id="estado">
        Tu turno — eres X
    </div>

    <div class="marcador">

        <div class="jugador">
            Tú (X)
            <b id="puntajeJugador">0</b>
        </div>

        <div class="empate">
            Empates
            <b id="puntajeEmpates">0</b>
        </div>

        <div class="maquina">
            Máquina (O)
            <b id="puntajeMaquina">0</b>
        </div>

    </div>

    <div class="tablero">

        <button class="casilla" data-pos="0"></button>
        <button class="casilla" data-pos="1"></button>
        <button class="casilla" data-pos="2"></button>

        <button class="casilla" data-pos="3"></button>
        <button class="casilla" data-pos="4"></button>
        <button class="casilla" data-pos="5"></button>

        <button class="casilla" data-pos="6"></button>
        <button class="casilla" data-pos="7"></button>
        <button class="casilla" data-pos="8"></button>

    </div>

    <div class="acciones">

        <button id="reiniciar">
            Nueva partida
        </button>

        <button id="borrarHistorial">
            Borrar historial
        </button>

    </div>

    <div class="historial">

        <h3>Historial de partidas</h3>

        <ul id="listaHistorial"></ul>

    </div>

</div>


<script>

    /*
     * ============================
     * CONFIGURACIÓN DEL JUEGO
     * ============================
     */

    const JUGADOR = "X";
    const MAQUINA = "O";

    const CLAVE_PARTIDA = "triqui_partida";
    const CLAVE_PUNTAJE = "triqui_puntaje";
    const CLAVE_HISTORIAL = "triqui_historial";

    let tablero = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];

    let juegoTerminado = false;

    let turnoJugador = true;

    let puntaje = cargarPuntaje();

    let historial = cargarHistorial();


    /*
     * Combinaciones ganadoras
     */

    const combinacionesGanadoras = [

        // Filas
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],

        // Columnas
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],

        // Diagonales
        [0, 4, 8],
        [2, 4, 6]

    ];


    const casillas =
        document.querySelectorAll(".casilla");

    const estado =
        document.getElementById("estado");

    const botonReiniciar =
        document.getElementById("reiniciar");

    const botonBorrarHistorial =
        document.getElementById("borrarHistorial");

    const puntajeJugadorEl =
        document.getElementById("puntajeJugador");

    const puntajeMaquinaEl =
        document.getElementById("puntajeMaquina");

    const puntajeEmpatesEl =
        document.getElementById("puntajeEmpates");

    const listaHistorial =
        document.getElementById("listaHistorial");


    /*
     * ============================
     * JUGADA DEL JUGADOR
     * ============================
     */

    casillas.forEach(casilla => {

        casilla.addEventListener("click", function() {

            if (juegoTerminado) {
                return;
            }

            if (!turnoJugador) {
                return;
            }

            const posicion =
                Number(this.dataset.pos);


            // No permitir jugar donde ya existe una ficha

            if (tablero[posicion] !== "") {
                return;
            }


            // Colocar X

            tablero[posicion] = JUGADOR;

            actualizarTablero();


            /*
             * Comprobar si el jugador ganó
             */

            if (comprobarResultado()) {
                return;
            }


            /*
             * Comprobar empate
             */

            if (tableroLleno()) {
                estado.textContent = "¡Empate!";
                juegoTerminado = true;
                registrarResultado("empate");
                return;
            }


            /*
             * Ahora juega la máquina
             */

            turnoJugador = false;

            estado.textContent =
                "La máquina está pensando...";


            // Pequeño retraso para que parezca que piensa

            setTimeout(() => {

                jugarMaquina();

            }, 500);

        });

    });


    /*
     * ============================
     * JUGADA DE LA MÁQUINA
     * ============================
     */

    function jugarMaquina() {

        if (juegoTerminado) {
            return;
        }


        /*
         * La máquina utiliza MINIMAX
         * para buscar la mejor jugada.
         */

        const mejorMovimiento =
            obtenerMejorMovimiento();


        tablero[mejorMovimiento] = MAQUINA;

        actualizarTablero();


        /*
         * Comprobar resultado
         */

        if (comprobarResultado()) {
            return;
        }


        /*
         * Comprobar empate
         */

        if (tableroLleno()) {

            estado.textContent =
                "¡Empate!";

            juegoTerminado = true;

            registrarResultado("empate");

            return;
        }


        /*
         * Volver al jugador
         */

        turnoJugador = true;

        estado.textContent =
            "Tu turno — eres X";

        guardarPartida();

    }


    /*
     * ============================
     * MINIMAX
     * ============================
     *
     * La máquina analiza las posibles
     * jugadas y selecciona la mejor.
     */

    function obtenerMejorMovimiento() {

        let mejorPuntuacion = -Infinity;

        let movimiento = -1;


        for (let i = 0; i < 9; i++) {

            if (tablero[i] === "") {

                tablero[i] = MAQUINA;


                const puntuacion =
                    minimax(tablero, false);


                tablero[i] = "";


                if (puntuacion > mejorPuntuacion) {

                    mejorPuntuacion =
                        puntuacion;

                    movimiento = i;
                }

            }

        }


        return movimiento;
    }


    /*
     * Algoritmo Minimax
     */

    function minimax(tableroActual, maximizando) {

        const resultado =
            obtenerGanador(tableroActual);


        /*
         * Si gana la máquina
         */

        if (resultado === MAQUINA) {
            return 10;
        }


        /*
         * Si gana el jugador
         */

        if (resultado === JUGADOR) {
            return -10;
        }


        /*
         * Empate
         */

        if (!tableroActual.includes("")) {
            return 0;
        }


        /*
         * Turno de la máquina
         */

        if (maximizando) {

            let mejorPuntuacion = -Infinity;


            for (let i = 0; i < 9; i++) {

                if (tableroActual[i] === "") {

                    tableroActual[i] = MAQUINA;


                    const puntuacion =
                        minimax(
                            tableroActual,
                            false
                        );


                    tableroActual[i] = "";


                    mejorPuntuacion =
                        Math.max(
                            mejorPuntuacion,
                            puntuacion
                        );
                }
            }


            return mejorPuntuacion;

        }


        /*
         * Turno del jugador
         */

        else {

            let mejorPuntuacion = Infinity;


            for (let i = 0; i < 9; i++) {

                if (tableroActual[i] === "") {

                    tableroActual[i] = JUGADOR;


                    const puntuacion =
                        minimax(
                            tableroActual,
                            true
                        );


                    tableroActual[i] = "";


                    mejorPuntuacion =
                        Math.min(
                            mejorPuntuacion,
                            puntuacion
                        );
                }
            }


            return mejorPuntuacion;
        }

    }


    /*
     * ============================
     * COMPROBAR GANADOR
     * ============================
     */

    function obtenerGanador(tableroActual) {

        for (
            const combinacion
            of combinacionesGanadoras
        ) {

            const a = combinacion[0];
            const b = combinacion[1];
            const c = combinacion[2];


            if (

                tableroActual[a] !== "" &&

                tableroActual[a] ===
                tableroActual[b] &&

                tableroActual[a] ===
                tableroActual[c]

            ) {

                return tableroActual[a];

            }

        }


        return null;
    }


    /*
     * ============================
     * COMPROBAR RESULTADO
     * ============================
     */

    function comprobarResultado() {

        const ganador =
            obtenerGanador(tablero);


        if (ganador === null) {
            return false;
        }


        juegoTerminado = true;


        if (ganador === JUGADOR) {

            estado.textContent =
                "🎉 ¡Ganaste!";

            registrarResultado("jugador");

        }

        else {

            estado.textContent =
                "🤖 ¡La máquina ganó!";

            registrarResultado("maquina");

        }


        /*
         * Resaltar línea ganadora
         */

        for (
            const combinacion
            of combinacionesGanadoras
        ) {

            const a = combinacion[0];
            const b = combinacion[1];
            const c = combinacion[2];


            if (

                tablero[a] !== "" &&

                tablero[a] === tablero[b] &&

                tablero[a] === tablero[c]

            ) {

                casillas[a]
                    .classList.add("ganadora");

                casillas[b]
                    .classList.add("ganadora");

                casillas[c]
                    .classList.add("ganadora");

                break;
            }

        }


        return true;
    }


    /*
     * ============================
     * TABLERO LLENO
     * ============================
     */

    function tableroLleno() {

        return !tablero.includes("");

    }


    /*
     * ============================
     * ACTUALIZAR TABLERO
     * ============================
     */

    function actualizarTablero() {

        casillas.forEach(casilla => {

            const posicion =
                Number(casilla.dataset.pos);

            const valor = tablero[posicion];


            if (valor === JUGADOR) {

                casilla.innerHTML =
                    '<span class="equis">X</span>';

            }

            else if (valor === MAQUINA) {

                casilla.innerHTML =
                    '<span class="circulo"></span>';

            }

            else {

                casilla.innerHTML = "";

            }


            /*
             * Deshabilitar casillas ocupadas
             */

            casilla.disabled =
                valor !== "";

        });


        guardarPartida();

    }


    /*
     * ============================
     * PUNTAJE (localStorage)
     * ============================
     */

    function cargarPuntaje() {

        try {

            const guardado =
                localStorage.getItem(CLAVE_PUNTAJE);

            if (!guardado) {
                return { jugador: 0, maquina: 0, empate: 0 };
            }

            return JSON.parse(guardado);

        } catch (error) {

            return { jugador: 0, maquina: 0, empate: 0 };

        }

    }


    function guardarPuntaje() {

        localStorage.setItem(
            CLAVE_PUNTAJE,
            JSON.stringify(puntaje)
        );

        actualizarMarcador();

    }


    function actualizarMarcador() {

        puntajeJugadorEl.textContent =
            puntaje.jugador || 0;

        puntajeMaquinaEl.textContent =
            puntaje.maquina || 0;

        puntajeEmpatesEl.textContent =
            puntaje.empate || 0;

    }


    /*
     * ============================
     * HISTORIAL DE PARTIDAS
     * ============================
     */

    function cargarHistorial() {

        try {

            const guardado =
                localStorage.getItem(CLAVE_HISTORIAL);

            return guardado ? JSON.parse(guardado) : [];

        } catch (error) {

            return [];

        }

    }


    function registrarResultado(tipo) {

        puntaje[tipo] =
            (puntaje[tipo] || 0) + 1;

        guardarPuntaje();


        let texto;

        if (tipo === "jugador") {
            texto = "🎉 Ganaste";
        }
        else if (tipo === "maquina") {
            texto = "🤖 Ganó la máquina";
        }
        else {
            texto = "🤝 Empate";
        }


        historial.unshift({
            texto: texto,
            fecha: new Date().toLocaleString()
        });

        // Guardar solo las últimas 20 partidas

        historial = historial.slice(0, 20);

        localStorage.setItem(
            CLAVE_HISTORIAL,
            JSON.stringify(historial)
        );

        renderHistorial();


        // La partida terminó, ya no hay nada que reanudar

        localStorage.removeItem(CLAVE_PARTIDA);

    }


    function renderHistorial() {

        listaHistorial.innerHTML = "";


        if (historial.length === 0) {

            const li = document.createElement("li");

            li.textContent =
                "Sin partidas registradas todavía.";

            listaHistorial.appendChild(li);

            return;
        }


        historial.forEach(item => {

            const li = document.createElement("li");

            li.textContent =
                item.texto + " — " + item.fecha;

            listaHistorial.appendChild(li);

        });

    }


    botonBorrarHistorial.addEventListener(
        "click",
        function() {

            const confirmado = confirm(
                "¿Borrar historial y puntaje?"
            );

            if (!confirmado) {
                return;
            }


            historial = [];

            puntaje = { jugador: 0, maquina: 0, empate: 0 };


            localStorage.removeItem(CLAVE_HISTORIAL);

            localStorage.removeItem(CLAVE_PUNTAJE);


            renderHistorial();

            actualizarMarcador();

        }
    );


    /*
     * ============================
     * GUARDAR / CARGAR PARTIDA EN CURSO
     * ============================
     */

    function guardarPartida() {

        if (juegoTerminado) {
            return;
        }

        localStorage.setItem(
            CLAVE_PARTIDA,
            JSON.stringify({
                tablero: tablero,
                turnoJugador: turnoJugador
            })
        );

    }


    function cargarPartidaGuardada() {

        let guardado;

        try {

            guardado =
                localStorage.getItem(CLAVE_PARTIDA);

        } catch (error) {

            return;

        }


        if (!guardado) {
            return;
        }


        try {

            const datos = JSON.parse(guardado);


            if (
                !Array.isArray(datos.tablero) ||
                datos.tablero.length !== 9
            ) {
                return;
            }


            tablero = datos.tablero;

            turnoJugador =
                datos.turnoJugador !== false;

            actualizarTablero();


            if (turnoJugador) {

                estado.textContent =
                    "Tu turno — eres X";

            }

            else {

                estado.textContent =
                    "La máquina está pensando...";

                setTimeout(() => {

                    jugarMaquina();

                }, 500);

            }

        } catch (error) {

            localStorage.removeItem(CLAVE_PARTIDA);

        }

    }


    /*
     * ============================
     * REINICIAR
     * ============================
     */

    botonReiniciar.addEventListener(
        "click",
        reiniciar
    );


    function reiniciar() {

        tablero = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];


        juegoTerminado = false;

        turnoJugador = true;


        casillas.forEach(casilla => {

            casilla.innerHTML = "";

            casilla.disabled = false;

            casilla.classList.remove(
                "ganadora"
            );

        });


        estado.textContent =
            "Tu turno — eres X";

        localStorage.removeItem(CLAVE_PARTIDA);

    }


    /*
     * ============================
     * INICIO
     * ============================
     */

    actualizarMarcador();

    renderHistorial();

    cargarPartidaGuardada();

</script>

</body>
</html>
